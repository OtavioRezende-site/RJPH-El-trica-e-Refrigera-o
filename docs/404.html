<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>RJPH Elétrica e Refrigeração</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages redirection script
      // Preserves paths and query parameters when refreshing deep routes
      var l = window.location;
      var segmentCount = 1;
      if (l.hostname.indexOf('github.io') === -1 || l.pathname.split('/').length <= 2) {
        segmentCount = 0;
      }
      if (l.pathname.indexOf('/docs') !== -1) {
        segmentCount = 2;
      }
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
